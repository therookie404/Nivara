<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 420" width="100%" height="100%">
  <defs>
    <style>
      .navy-fill { fill: #0f3675; }
      .blue-fill { fill: #2176e8; }
      .blue-stroke { stroke: #2176e8; fill: none; }
      
      /* Typography matches the HTML file's modern sans-serif stack */
      .brand-text-style {
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
        font-size: 88px;
        font-weight: 800;
        fill: #0f3675;
      }
      
      /* Animation Sequence */
      .anim-shield {
        stroke-dasharray: 450;
        stroke-dashoffset: 450;
        animation: drawShield 1.1s cubic-bezier(0.4, 0, 0.2, 1) forwards;
      }
      .anim-arrow {
        stroke-dasharray: 350;
        stroke-dashoffset: 350;
        animation: drawArrow 0.9s cubic-bezier(0.4, 0, 0.2, 1) 0.6s forwards;
      }
      .anim-arrowhead {
        opacity: 0;
        transform: scale(0.6);
        transform-origin: 332.9px 70.4px;
        animation: popHead 0.4s cubic-bezier(0.34, 1.35, 0.64, 1) 1.2s forwards;
      }
      .anim-text {
        opacity: 0;
        transform: translateY(8px);
        animation: fadeTextUp 0.6s ease-out 1.4s forwards;
      }

      @keyframes drawShield { to { stroke-dashoffset: 0; } }
      @keyframes drawArrow { to { stroke-dashoffset: 0; } }
      @keyframes popHead { to { opacity: 1; transform: scale(1); } }
      @keyframes fadeTextUp { to { opacity: 1; transform: translateY(0); } }
    </style>
  </defs>

  <!-- SHIELD & ARROW ICON -->
  <g id="icon-group">
    <!-- Outer Shield Outline -->
    <path class="navy-fill anim-shield" 
          d="M 250,55 
             C 278,92 314,105 352,108 
             C 356,182 322,238 250,285 
             C 178,238 144,182 148,108 
             C 186,105 222,92 250,55 Z"
          fill-rule="evenodd"/>
          
    <!-- Shield Inner Fill Structure -->
    <path d="M 250,80 
             C 272,110 300,121 330,123 
             C 333,180 305,223 250,262 
             C 195,223 167,180 170,123 
             C 200,121 228,110 250,80 Z"
          fill="none" stroke="#0f3675" stroke-width="16" stroke-linejoin="round"/>

    <!-- Upward Trend Line / Dynamic Arrow -->
    <polyline class="blue-stroke anim-arrow"
              points="140,240 200,165 245,200 309.4,105.2"
              stroke-width="22"
              stroke-linecap="round"
              stroke-linejoin="round"/>
              
    <!-- Arrow Head (aligned to the trend-line axis; tip is the scale pivot) -->
    <polygon class="blue-fill anim-arrowhead"
             points="332.9,70.4 329.8,114.2 293.4,89.5"
             stroke="#2176e8"
             stroke-width="8"
             stroke-linejoin="round"/>
  </g>

  <!-- BRAND WORDMARK: Perfectly Kerned NIVA₹A -->
  <text x="250" y="380" class="brand-text-style anim-text" text-anchor="middle" letter-spacing="2">
    NIV<tspan dx="-4">A</tspan><tspan dx="-6">₹</tspan><tspan dx="-6">A</tspan>
  </text>
</svg>
